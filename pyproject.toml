[project]
name = "kookbot-harness"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "aiomysql>=0.2,<0.3",
  "alembic>=1.13,<2",
  "httpx>=0.27,<1",
  "khl.py==0.3.17",
  "openai-agents==0.21.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "sqlalchemy[asyncio]>=2,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
